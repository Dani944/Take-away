<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Spice N Grill Admin</title><style>body{font:14px Arial;background:#111;color:#eee;margin:0;padding:25px}button,input,select{padding:10px;background:#222;color:#fff;border:1px solid #555}button{cursor:pointer}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.order{background:#1c1c1c;border:1px solid #333;padding:18px;margin:12px 0}.order h3{margin-top:0}.pill{color:#d9b56d;font-weight:bold}.map{color:#8cc8ff}.items{color:#bbb}</style></head><body><h1>TAKE AWAY — Admin</h1><div class="bar"><input id="token" type="password" placeholder="Admin token"><button onclick="load()">Refresh orders</button></div><div id="orders">Enter the admin token and refresh.</div><script>
async function load(){let t=document.getElementById("token").value;localStorage.admin=t;let r=await fetch("/api/admin/orders",{headers:{Authorization:"Bearer "+t}});let d=await r.json();if(!r.ok){orders.innerHTML="<p>"+(d.error||"Unauthorized")+"</p>";return}orders.innerHTML=d.map(o=>`<div class="order"><h3>#${o.id} — ${o.customer_name} <span class="pill">${o.status}</span></h3><p>Phone: ${o.phone}</p><p>Type: ${o.order_type} | Payment: ${o.payment_method}</p><p>Address: ${o.address||"Pickup"}</p><p>Items: ${o.items}</p><p>Total: <b>${Number(o.total).toFixed(2)} BHD</b></p>${o.latitude?`<a class="map" target="_blank" href="https://www.google.com/maps?q=${o.latitude},${o.longitude}">Open customer location</a>`:""}<p><select onchange="status(${o.id},this.value)">${["new","accepted","preparing","ready","out_for_delivery","delivered","cancelled"].map(s=>`<option ${s==o.status?"selected":""}>${s}</option>`).join("")}</select></p></div>`).join("")}
async function status(id,s){let t=localStorage.admin||document.getElementById("token").value;await fetch("/api/admin/orders/"+id,{method:"PATCH",headers:{"Authorization":"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({status:s})});load()} 
</script></body></html>
